<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Grafik Uygulaması</title>
  <style>
    body {
      margin: 0;
      background: #131722;
      font-family: Arial, sans-serif;
    }

    #grafik-alani {
      width: 100%;
      height: 420px;
      background: #131722;
    }
  </style>
</head>
<body>
  <div id="grafik-alani"></div>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const container = document.getElementById('grafik-alani');

    const chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 420,
      layout: {
        background: { color: '#131722' },
        textColor: '#d1d4dc',
      },
      rightPriceScale: {
        borderColor: '#2b2e39',
      },
      timeScale: {
        borderColor: '#2b2e39',
      },
    });

    const candlestickSeries = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      borderVisible: false,
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
    });

    candlestickSeries.setData([
      { time: '2026-10-18', open: 2650, high: 2680, low: 2640, close: 2670 },
      { time: '2026-10-19', open: 2670, high: 2700, low: 2665, close: 2690 },
      { time: '2026-10-20', open: 2690, high: 2720, low: 2685, close: 2715 },
      { time: '2026-10-21', open: 2715, high: 2750, low: 2710, close: 2740 }
    ]);

    chart.timeScale().fitContent();
  </script>
</body>
</html>
