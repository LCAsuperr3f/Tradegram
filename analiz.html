<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Grafik Uygulaması</title>
  <style>
    :root {
      --bg: #131722;
      --panel: #1e222d;
      --grid: #2b2e39;
      --text: #d1d4dc;
      --up: #26a69a;
      --down: #ef5350;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    #grafik-alani {
      width: 100%;
      height: 420px;
      min-height: 420px;
      background: var(--bg);
      border: 1px solid var(--grid);
    }
  </style>
</head>
<body>
  <div id="grafik-alani"></div>

  <script>
    (function () {
      const container = document.getElementById('grafik-alani');

      if (!container) {
        return;
      }

      function showError(message) {
        container.innerHTML = '<div style="padding: 16px; color: #fff; font-family: Arial, sans-serif;">' + message + '</div>';
      }

      function initChart() {
        if (!window.LightweightCharts) {
          showError('Grafik kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.');
          return;
        }

        const chart = window.LightweightCharts.createChart(container, {
          width: container.clientWidth || window.innerWidth,
          height: 420,
          layout: {
            background: { color: '#131722' },
            textColor: '#d1d4dc',
          },
          grid: {
            vertLines: { color: '#2b2e39' },
            horzLines: { color: '#2b2e39' },
          },
          rightPriceScale: {
            borderColor: '#2b2e39',
          },
          timeScale: {
            borderColor: '#2b2e39',
            timeVisible: true,
            secondsVisible: false,
          },
          crosshair: {
            mode: window.LightweightCharts.CrosshairMode.Normal,
          },
        });

        const candlestickSeries = chart.addCandlestickSeries({
          upColor: '#26a69a',
          downColor: '#ef5350',
          borderVisible: false,
          wickUpColor: '#26a69a',
          wickDownColor: '#ef5350',
          priceLineVisible: true,
        });

        const data = [
          { time: '2026-10-18', open: 2650, high: 2680, low: 2640, close: 2670 },
          { time: '2026-10-19', open: 2670, high: 2700, low: 2665, close: 2690 },
          { time: '2026-10-20', open: 2690, high: 2720, low: 2685, close: 2715 },
          { time: '2026-10-21', open: 2715, high: 2750, low: 2710, close: 2740 },
          { time: '2026-10-22', open: 2740, high: 2775, low: 2735, close: 2765 },
        ];

        candlestickSeries.setData(data);
        chart.timeScale().fitContent();

        const resizeChart = () => {
          chart.applyOptions({
            width: container.clientWidth || window.innerWidth,
          });
        };

        window.addEventListener('resize', resizeChart);

        return chart;
      }

      if (window.LightweightCharts) {
        initChart();
      } else {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js';
        script.onload = initChart;
        script.onerror = function () {
          showError('CDN yüklenemedi. Lütfen internet bağlantınızı kontrol edin.');
        };
        document.head.appendChild(script);
      }
    })();
  </script>
</body>
</html>
