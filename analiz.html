<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradegram Analiz</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #111827;
      --panel: #111b2d;
      --panel-2: #172235;
      --grid: #273449;
      --text: #e5edf7;
      --muted: #9aa9bf;
      --up: #26a69a;
      --down: #ef5350;
      --accent: #5aa9ff;
      --warning: #f6c453;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1400px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(17, 27, 45, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px 22px;
      box-shadow: 0 10px 30px var(--shadow);
    }

    .brand {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
    }

    .brand span {
      color: var(--accent);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    select, button {
      border: 1px solid var(--grid);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    button {
      background: linear-gradient(135deg, var(--accent), #4ad7ff);
      color: #06111a;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 16px;
    }

    .stat {
      background: rgba(17, 27, 45, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px 16px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .positive { color: var(--up); }
    .negative { color: var(--down); }

    .panel {
      background: rgba(17, 27, 45, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      padding: 18px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chart-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .trend-badge {
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(38,166,154,0.12);
      color: var(--up);
      border: 1px solid rgba(38,166,154,0.3);
    }

    .trend-badge.down {
      background: rgba(239,83,80,0.12);
      color: var(--down);
      border-color: rgba(239,83,80,0.3);
    }

    #grafik-alani {
      width: 100%;
      height: 440px;
      min-height: 440px;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      border: 1px solid var(--grid);
    }

    .lower-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .analysis-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 220px;
    }

    .summary-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
    }

    .summary-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .summary-item .label {
      color: var(--muted);
      font-size: 0.8rem;
      display: block;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .summary-item .value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .signal-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .signal-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .signal-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .signal-label {
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .lower-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .controls { justify-content: space-between; }
      .controls select, .controls button { flex: 1; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Tradegram <span>Analiz</span></div>
      <div class="controls">
        <select id="symbolSelect" aria-label="Sembol seçimi">
          <option value="BTCUSDT">BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="SOLUSDT">SOL/USDT</option>
          <option value="XRPUSDT">XRP/USDT</option>
        </select>

        <select id="intervalSelect" aria-label="Periyot seçimi">
          <option value="1m">1M</option>
          <option value="5m">5M</option>
          <option value="15m">15M</option>
          <option value="1h">1H</option>
          <option value="4h">4H</option>
        </select>

        <button id="refreshBtn">Yenile</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Son Fiyat</div>
        <div class="stat-value" id="lastPrice">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">24s Değişim</div>
        <div class="stat-value" id="changePercent">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Yüksek</div>
        <div class="stat-value" id="highPrice">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Düşük</div>
        <div class="stat-value" id="lowPrice">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Hacim</div>
        <div class="stat-value" id="volumeValue">--</div>
      </div>
    </section>

    <section class="panel">
      <div class="chart-header">
        <div class="chart-title" id="marketTitle">BTCUSDT</div>
        <div class="trend-badge" id="trendBadge">Analiz Bekleniyor</div>
      </div>
      <div id="grafik-alani"></div>
    </section>

    <section class="lower-grid">
      <div class="panel analysis-box">
        <div class="chart-title">Analiz Özeti</div>
        <div class="summary-list" id="summaryList"></div>
      </div>

      <div class="panel signal-box">
        <div class="chart-title">Sinyal</div>
        <div class="signal-row"><span class="signal-label">Momentum</span><strong id="momentumSignal">--</strong></div>
        <div class="signal-row"><span class="signal-label">Trend</span><strong id="trendSignal">--</strong></div>
        <div class="signal-row"><span class="signal-label">Volatilite</span><strong id="volatilitySignal">--</strong></div>
        <div class="signal-row"><span class="signal-label">RSI</span><strong id="rsiSignal">--</strong></div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    (function () {
      const state = {
        symbol: 'BTCUSDT',
        interval: '1m',
        data: [],
        chart: null,
        series: null,
        socket: null,
      };

      const elements = {
        symbolSelect: document.getElementById('symbolSelect'),
        intervalSelect: document.getElementById('intervalSelect'),
        refreshBtn: document.getElementById('refreshBtn'),
        lastPrice: document.getElementById('lastPrice'),
        changePercent: document.getElementById('changePercent'),
        highPrice: document.getElementById('highPrice'),
        lowPrice: document.getElementById('lowPrice'),
        volumeValue: document.getElementById('volumeValue'),
        marketTitle: document.getElementById('marketTitle'),
        trendBadge: document.getElementById('trendBadge'),
        summaryList: document.getElementById('summaryList'),
        momentumSignal: document.getElementById('momentumSignal'),
        trendSignal: document.getElementById('trendSignal'),
        volatilitySignal: document.getElementById('volatilitySignal'),
        rsiSignal: document.getElementById('rsiSignal')
      };

      function formatPrice(value) {
        if (!Number.isFinite(value)) return '--';
        return Number(value).toLocaleString('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function formatCompact(value) {
        if (!Number.isFinite(value)) return '--';
        if (value >= 1000000) return (value / 1000000).toFixed(2) + 'M';
        if (value >= 1000) return (value / 1000).toFixed(2) + 'K';
        return value.toFixed(2);
      }

      function formatPercent(value) {
        if (!Number.isFinite(value)) return '--';
        const text = value.toFixed(2) + '%';
        return text;
      }

      function colorize(value, element) {
        if (value > 0) {
          element.classList.remove('negative');
          element.classList.add('positive');
        } else if (value < 0) {
          element.classList.remove('positive');
          element.classList.add('negative');
        } else {
          element.classList.remove('positive', 'negative');
        }
      }

      function mapKline(kline) {
        return {
          time: Math.floor(kline[0] / 1000),
          open: Number(kline[1]),
          high: Number(kline[2]),
          low: Number(kline[3]),
          close: Number(kline[4]),
          volume: Number(kline[5]),
        };
      }

      function calculateRSI(closes, period = 14) {
        if (closes.length < period + 1) return 50;
        let gains = 0;
        let losses = 0;

        for (let i = 1; i <= period; i++) {
          const diff = closes[closes.length - i] - closes[closes.length - i - 1];
          if (diff >= 0) gains += diff; else losses -= diff;
        }

        const avgGain = gains / period;
        const avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        const rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
      }

      function buildSummary(data) {
        const latest = data[data.length - 1];
        const prev = data[data.length - 2] || latest;
        const closes = data.map(item => item.close);
        const avgClose = closes.reduce((sum, value) => sum + value, 0) / closes.length;
        const volume = data.reduce((sum, item) => sum + item.volume, 0);
        const volatility = data.reduce((sum, item) => sum + Math.abs(item.close - item.open), 0) / data.length;
        const momentum = ((latest.close - prev.close) / prev.close) * 100;
        const rsi = calculateRSI(closes);

        const trendText = latest.close >= avgClose ? 'Yükseliş' : 'Düşüş';
        const momentumText = momentum >= 0 ? 'Güçlü' : 'Zayıf';
        const volatilityText = volatility >= (avgClose * 0.003) ? 'Yüksek' : 'Normal';

        return {
          avgClose,
          volume,
          volatility,
          momentum,
          rsi,
          trendText,
          momentumText,
          volatilityText,
        };
      }

      function updateSummaryUI(summary) {
        const items = [
          { label: 'Ortalama Fiyat', value: '$' + formatPrice(summary.avgClose) },
          { label: 'Momentum', value: summary.momentumText },
          { label: 'Hacim', value: '$' + formatCompact(summary.volume) },
          { label: 'Volatilite', value: summary.volatilityText },
        ];

        elements.summaryList.innerHTML = items.map(item => `
          <div class="summary-item">
            <span class="label">${item.label}</span>
            <span class="value">${item.value}</span>
          </div>
        `).join('');

        const signalTrend = summary.momentum >= 0 ? 'Alım baskısı' : 'Satım baskısı';
        const signalType = summary.rsi > 70 ? 'Aşırı Alım' : summary.rsi < 30 ? 'Aşırı Satım' : 'Nötr';

        elements.momentumSignal.textContent = signalTrend;
        elements.trendSignal.textContent = summary.trendText;
        elements.volatilitySignal.textContent = summary.volatilityText;
        elements.rsiSignal.textContent = `${signalType} (${summary.rsi.toFixed(1)})`;
      }

      function renderMarketStats(data) {
        if (!data.length) return;

        const current = data[data.length - 1];
        const previous = data[data.length - 2] || current;
        const change = ((current.close - previous.close) / previous.close) * 100;
        const high = Math.max(...data.map(item => item.high));
        const low = Math.min(...data.map(item => item.low));
        const totalVolume = data.reduce((sum, item) => sum + item.volume, 0);

        elements.lastPrice.textContent = '$' + formatPrice(current.close);
        elements.changePercent.textContent = formatPercent(change);
        colorize(change, elements.changePercent);
        elements.highPrice.textContent = '$' + formatPrice(high);
        elements.lowPrice.textContent = '$' + formatPrice(low);
        elements.volumeValue.textContent = '$' + formatCompact(totalVolume);

        const trendBadgeText = change >= 0 ? 'Yükseliş' : 'Düşüş';
        elements.trendBadge.textContent = trendBadgeText;
        elements.trendBadge.classList.toggle('down', change < 0);
        elements.marketTitle.textContent = state.symbol;
      }

      function initializeChart() {
        if (!window.LightweightCharts) {
          document.getElementById('grafik-alani').innerHTML = '<div style="padding:16px;color:#fff;">Lightweight Charts yüklenemedi.</div>';
          return;
        }

        const chartContainer = document.getElementById('grafik-alani');
        state.chart = window.LightweightCharts.createChart(chartContainer, {
          width: chartContainer.clientWidth || window.innerWidth,
          height: 440,
          layout: {
            background: { color: '#111827' },
            textColor: '#d1d4dc',
          },
          grid: {
            vertLines: { color: '#273449' },
            horzLines: { color: '#273449' },
          },
          rightPriceScale: { borderColor: '#2b2e39' },
          timeScale: { borderColor: '#2b2e39', timeVisible: true, secondsVisible: false },
          crosshair: { mode: window.LightweightCharts.CrosshairMode.Normal },
        });

        state.series = state.chart.addCandlestickSeries({
          upColor: '#26a69a',
          downColor: '#ef5350',
          borderVisible: false,
          wickUpColor: '#26a69a',
          wickDownColor: '#ef5350',
        });

        window.addEventListener('resize', () => {
          if (state.chart) {
            state.chart.applyOptions({ width: chartContainer.clientWidth || window.innerWidth });
          }
        });
      }

      function updateChartFromData(data) {
        if (!state.series) return;
        state.series.setData(data.slice(-250));
        state.chart.timeScale().fitContent();
      }

      function applyLiveCandle(candle) {
        if (!state.data.length) return;

        const last = state.data[state.data.length - 1];

        if (last.time === candle.time) {
          last.open = candle.open;
          last.high = Math.max(last.high, candle.high);
          last.low = Math.min(last.low, candle.low);
          last.close = candle.close;
          last.volume = candle.volume;
        } else {
          state.data.push(candle);
          if (state.data.length > 250) state.data.shift();
        }

        updateChartFromData(state.data);
        renderMarketStats(state.data);
        updateSummaryUI(buildSummary(state.data));
      }

      async function loadData() {
        try {
          const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${state.symbol}&interval=${state.interval}&limit=200`);
          if (!response.ok) throw new Error('Binance verisi alınamadı');
          const raw = await response.json();
          state.data = raw.map(mapKline);
          updateChartFromData(state.data);
          renderMarketStats(state.data);
          updateSummaryUI(buildSummary(state.data));
        } catch (error) {
          document.getElementById('grafik-alani').innerHTML = '<div style="padding:16px;color:#fff;">Canlı fiyat verisi alınamadı. Lütfen internet bağlantınızı kontrol edin.</div>';
        }
      }

      function connectLiveFeed() {
        if (state.socket) {
          state.socket.close();
        }

        const wsUrl = `wss://stream.binance.com:9443/ws/${state.symbol.toLowerCase()}@kline_${state.interval}`;
        state.socket = new WebSocket(wsUrl);

        state.socket.onmessage = function (event) {
          try {
            const msg = JSON.parse(event.data);
            const k = msg.k;
            if (!k) return;

            const candle = {
              time: Math.floor(k.t / 1000),
              open: Number(k.o),
              high: Number(k.h),
              low: Number(k.l),
              close: Number(k.c),
              volume: Number(k.v),
            };

            applyLiveCandle(candle);
          } catch (error) {
            console.error('WebSocket hata:', error);
          }
        };

        state.socket.onerror = function () {
          console.warn('WebSocket erişimi yok veya bağlantı kesildi.');
        };

        state.socket.onclose = function () {
          setTimeout(() => {
            if (document.visibilityState === 'visible') {
              connectLiveFeed();
            }
          }, 3000);
        };
      }

      elements.symbolSelect.addEventListener('change', function () {
        state.symbol = this.value;
        loadData();
        connectLiveFeed();
      });

      elements.intervalSelect.addEventListener('change', function () {
        state.interval = this.value;
        loadData();
        connectLiveFeed();
      });

      elements.refreshBtn.addEventListener('click', function () {
        loadData();
        connectLiveFeed();
      });

      initializeChart();
      loadData();
      connectLiveFeed();
    })();
  </script>
</body>
</html>
