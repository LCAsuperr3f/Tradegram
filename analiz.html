<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Grafik Uygulaması</title>
  <style>
    :root {
      --bg: #131722;
      --panel: #1e222d;
      --grid: #2b2e39;
      --text: #d1d4dc;
      --up: #26a69a;
      --down: #ef5350;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    #grafik-alani {
      width: 100%;
      height: 420px;
      min-height: 420px;
      background: var(--bg);
      border: 1px solid var(--grid);
    }
  </style>
</head>
<body>
  <div id="grafik-alani"></div>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    (function () {
      const container = document.getElementById('grafik-alani');
      if (!container) return;

      function showError(message) {
        container.innerHTML = '<div style="padding: 16px; color: #fff; font-family: Arial, sans-serif;">' + message + '</div>';
      }

      if (!window.LightweightCharts) {
        showError('Lightweight Charts yüklenemedi.');
        return;
      }

      const chart = window.LightweightCharts.createChart(container, {
        width: container.clientWidth || window.innerWidth,
        height: 420,
        layout: {
          background: { color: '#131722' },
          textColor: '#d1d4dc',
        },
        grid: {
          vertLines: { color: '#2b2e39' },
          horzLines: { color: '#2b2e39' },
        },
        rightPriceScale: {
          borderColor: '#2b2e39',
        },
        timeScale: {
          borderColor: '#2b2e39',
          timeVisible: true,
          secondsVisible: false,
        },
        crosshair: {
          mode: window.LightweightCharts.CrosshairMode.Normal,
        },
      });

      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
        priceLineVisible: true,
      });

      function mapKlineToCandle(kline) {
        return {
          time: Math.floor(kline[0] / 1000),
          open: Number(kline[1]),
          high: Number(kline[2]),
          low: Number(kline[3]),
          close: Number(kline[4]),
        };
      }

      function updateChartWithLiveCandle(candle) {
        const last = candlestickSeries.data().at(-1);

        if (!last || last.time !== candle.time) {
          candlestickSeries.update(candle);
          return;
        }

        const updated = {
          ...last,
          high: Math.max(last.high, candle.high),
          low: Math.min(last.low, candle.low),
          close: candle.close,
        };

        candlestickSeries.update(updated);
      }

      async function loadInitialData() {
        const url = 'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=200';

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error('Binance verisi alınamadı');
          }

          const data = await response.json();
          const candles = data.map(mapKlineToCandle);
          candlestickSeries.setData(candles);
          chart.timeScale().fitContent();
        } catch (error) {
          showError('Canlı fiyat verisi alınamadı. Binance erişimini kontrol edin.');
        }
      }

      function connectLiveFeed() {
        const socket = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');

        socket.onmessage = function (event) {
          try {
            const msg = JSON.parse(event.data);
            const k = msg.k;
            if (!k) return;

            const candle = {
              time: Math.floor(k.t / 1000),
              open: Number(k.o),
              high: Number(k.h),
              low: Number(k.l),
              close: Number(k.c),
            };

            updateChartWithLiveCandle(candle);
          } catch (err) {
            console.error('WebSocket veri hatası:', err);
          }
        };

        socket.onerror = function () {
          console.warn('Binance canlı bağlantı hatası. Yeniden bağlanma denenebilir.');
        };

        socket.onclose = function () {
          setTimeout(connectLiveFeed, 5000);
        };
      }

      loadInitialData();
      connectLiveFeed();

      const resizeChart = () => {
        chart.applyOptions({
          width: container.clientWidth || window.innerWidth,
        });
      };

      window.addEventListener('resize', resizeChart);
    })();
  </script>
</body>
</html>
